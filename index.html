<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knock Knock</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #020816 url("starry-night.png") center/cover no-repeat;
    color: white;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 4, 18, .10);
  }

  .login {
    position: absolute;
    top: 24%;
    left: 50%;
    transform: translateX(-50%);
    width: min(760px, 82vw);
    display: flex;
    align-items: center;
    padding: 8px 12px 8px 20px;
    border: 1px solid rgba(150, 195, 255, .45);
    border-radius: 28px;
    background: rgba(5, 12, 30, .28);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 22px rgba(80, 150, 255, .20);
  }

  .icon { font-size: 25px; opacity: .9; margin-right: 14px; }

  input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    font: italic 24px Georgia, serif;
  }

  input::placeholder { color: rgba(255,255,255,.78); }

  button {
    border: 0;
    border-left: 1px solid rgba(180,210,255,.30);
    background: transparent;
    color: white;
    font-size: 28px;
    padding: 6px 12px 6px 18px;
    cursor: pointer;
    transition: transform .2s, text-shadow .2s;
  }

  button:hover {
    transform: scale(1.12);
    text-shadow: 0 0 12px #9ecbff;
  }

  .error {
    position: absolute;
    top: calc(24% + 72px);
    left: 50%;
    transform: translateX(-50%);
    color: #ffd9df;
    font-size: 14px;
    opacity: 0;
    transition: opacity .2s;
  }

  @media (max-width: 600px) {
    .login { top: 22%; width: 88vw; }
    input { font-size: 18px; }
    button { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="overlay"></div>

<form class="login" id="loginForm">
  <span class="icon">⌕</span>
  <input id="password" type="password" autocomplete="off"
         placeholder="knock knock who's there" aria-label="Password">
  <button type="submit" aria-label="Enter">☆</button>
</form>

<div class="error" id="error">The stars don't recognize that password.</div>

<script>
  // Change this to the single password you want.
  const PASSWORD = "Neer";

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const entered = document.getElementById("password").value;

    if (entered === PASSWORD) {
      window.location.href = "page2.html";
    } else {
      const error = document.getElementById("error");
      error.style.opacity = "1";
      setTimeout(() => error.style.opacity = "0", 1800);
    }
  });
</script>
</body>
</html>
