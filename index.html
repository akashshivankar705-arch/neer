<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knock Knock</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #020816 url("starry-night.png") center/cover no-repeat;
    color: white;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 4, 18, .10);
  }

  .login {
    position: absolute;
    top: 33.2%;
    left: 50%;
    transform: translateX(-50%);
    width: min(650px, 86vw);
    height: 76px;
    display: flex;
    align-items: center;
    background: transparent;
    border: 0;
    box-shadow: none;
  }

  input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: transparent;
    caret-color: white;
    font-size: 20px;
    padding: 0 62px;
  }

  input::placeholder { color: transparent; }

  button {
    width: 62px;
    height: 100%;
    border: 0;
    background: transparent;
    color: transparent;
    cursor: pointer;
  }

  .error {
    position: absolute;
    top: calc(24% + 72px);
    left: 50%;
    transform: translateX(-50%);
    color: #ffd9df;
    font-size: 14px;
    opacity: 0;
    transition: opacity .2s;
  }

  @media (max-width: 600px) {
    .login { top: 22%; width: 88vw; }
    input { font-size: 18px; }
    button { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="overlay"></div>

<form class="login" id="loginForm" aria-label="Password entry">
  <input id="password" type="password" autocomplete="off" aria-label="Password">
  <button type="submit" aria-label="Enter"></button>
</form>

<div class="error" id="error">The stars don't recognize that password.</div>

<script>
  // Change this to the single password you want.
  const PASSWORD = "Neer";

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const entered = document.getElementById("password").value;

    if (entered === PASSWORD) {
      window.location.href = "page2.html";
    } else {
      const error = document.getElementById("error");
      error.style.opacity = "1";
      setTimeout(() => error.style.opacity = "0", 1800);
    }
  });
</script>
</body>
</html>
